## Fill in the values for your cluster
##
---
cluster_name: "curnagl" # [str]
granularity_memory_request: 1 # [number] in GB,
partitions: # a list of the different partitions on the cluster
  cpu: # name of the partition
    type: 'CPU' # [CPU or GPU]
    model: "AMD" # [str] the model of the processing core on this partition
    TDP: 8 # [number] TDP of the processor, in W, per core
  gpu:
    type: 'GPU'
    model: "NVIDIA A100"
    TDP: 250 # For GPUs, the TDP is for the entire GPU
    model_CPU: "Intel XXX" # from HPC team
    TDP_CPU: 8
PUE: 1.67 # [number > 1] Power Usage Effectiveness of the facility
CI: 41 # [number] carbon intensity of the geographic location, in gCO2e/kWh

# https://ourworldindata.org/grapher/carbon-intensity-electricity
default_unit_RSS: 'K'